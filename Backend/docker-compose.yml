services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: copytrade_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend API ────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "5115:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      Loki__Password: "${LOKI_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: "../Mock FrontEnd"
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    profiles:
      - frontend

volumes:
  mysql_data:
