name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Stress"

      # TODO: deploy step — when a prod server is available, add:
      #   - Set short SHA: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      #   - SSH into server and run: ApiVersion=$SHORT_SHA docker compose up --build -d api
